<title>Defini Cachos | Grupo da estreia</title>
<style>
  :root { --coral:#FF6968; --amarelo:#FFD500; --vinho:#C6302F; --tinta:#2b0f10; }
  html,body { margin:0; min-height:100%; background:var(--coral); color:var(--tinta); font-family: "Segoe UI", Arial, sans-serif; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 20px; box-sizing:border-box; }
  h1 { font-size:30px; line-height:1.15; margin:0 0 10px; }
  p { font-size:17px; margin:0 0 26px; max-width:340px; }
  a.btn { display:block; width:100%; max-width:340px; box-sizing:border-box; background:#128C4A; color:#fff; font-weight:800; text-decoration:none; padding:20px 24px; border-radius:16px; font-size:20px; box-shadow:0 6px 0 rgba(0,0,0,.18); }
  a.btn:active { transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .passo { font-size:15px; margin-top:18px; max-width:340px; }
  a.alt { color:var(--tinta); font-weight:700; }
  .marca { font-size:13px; margin-top:28px; }
</style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-8T0GMFR8V8"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

</script>

<body>
<main>
  <h1>Falta 1 toque pra entrar no grupo da estreia</h1>
  <p>Toque no botão verde. O WhatsApp abre e é só tocar em <b>"Entrar no grupo"</b>.</p>
  <a id="btn" class="btn" href="#">Entrar no grupo agora</a>
  <div class="passo">Não abriu? <a id="alt" class="alt" href="#">Toque aqui</a> e depois em "Abrir app" ou "Entrar no grupo".</div>
  <div class="marca">Defini Cachos · estreia ao vivo dia 29/10</div>
</main>
<script>
  // Alvo atual. Para trocar de grupo: trocar o CODIGO (parte final do link do grupo, em base64) e publicar de novo.
  var CODIGO = atob("R212QkJjdmdiUVo4eW91YWlYeVJzNw==");
  var WEB = "https://chat.whatsapp.com/" + CODIGO;
  var android = /Android/i.test(navigator.userAgent || "");
  // Android: intent abre o WhatsApp direto e, se não tiver o app, cai no link web. iPhone: esquema whatsapp://.
  var DESTINO = android
    ? "intent://chat/?code=" + CODIGO + "#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=" + encodeURIComponent(WEB) + ";end"
    : "whatsapp://chat?code=" + CODIGO;
  var q = new URLSearchParams(location.search);
  var origem = q.get('o') || 'direto';
  var btn = document.getElementById('btn');
  var alt = document.getElementById('alt');
  btn.href = DESTINO;
  alt.href = WEB;
  var marcado = false;
  function marcar(via){
    if (marcado) return; marcado = true;
    try { fbq('track', 'Lead', { content_name: 'grupo-estreia', origem: origem, via: via }); } catch(e){}
    try { gtag('event', 'whatsapp_click', { origem: origem, via: via, transport_type: 'beacon' }); } catch(e){}
  }
  btn.addEventListener('click', function(){ marcar('botao'); });
  alt.addEventListener('click', function(){ marcar('link_web'); });
  // Tentativa automática de abrir o app. Dentro do Instagram às vezes só abre com o toque no botão. ?nr=1 desliga (teste).
  if (!q.get('nr')) { setTimeout(function(){ location.href = DESTINO; }, 600); }
</script>
</body>
</html>
